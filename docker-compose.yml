services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        UID: ${OP_UID:-1000}
        GID: ${OP_GID:-1000}
    env_file: .env
    environment:
      PARSER_REQUIRE_REALTY_MARTS: "1"
    volumes:
      - ./downloads:/app/downloads
      - ./data:/app/data
      - ./state:/app/state
      - ./logs:/app/logs
      - ./config:/app/config
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    depends_on:
      - backend
    ports:
      - "8080:8080"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  # Не поднимается вместе с `up -d` (profile не входит в default).
  # Полный прогон: docker compose run --rm updater
  updater:
    build:
      context: .
      dockerfile: docker/updater.Dockerfile
      args:
        UID: ${OP_UID:-1000}
        GID: ${OP_GID:-1000}
    env_file: .env
    volumes:
      - ./downloads:/app/downloads
      - ./data:/app/data
      - ./state:/app/state
      - ./logs:/app/logs
      - ./config:/app/config
    shm_size: "10gb"
    profiles: ["updater"]
