<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Рынок недвижимости Москвы — июль 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js"></script>
<style>
:root{
  --bg:#101923;
  --bg2:#0c141d;
  --panel:#1a2634;
  --panel2:#212f40;
  --stroke:#2b3d50;
  --text:#e8eef4;
  --muted:#8ba0b5;
  --red:#e84c4c;
  --red-soft:rgba(232,76,76,.9);
  --gray-bar:rgba(148,169,188,.5);
  --navy-bar:#3b566f;
  --teal:#6fb3d2;
  --green:#2fbf71;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg2);
  color:var(--text);
  font-family:'Montserrat','Segoe UI',Roboto,Arial,sans-serif;
  font-size:14px;
  overflow:hidden;
}
/* ---------- шапка ---------- */
header{
  height:56px;display:flex;align-items:center;gap:14px;
  padding:0 18px;background:var(--panel);border-bottom:1px solid var(--stroke);
}
#burger{
  width:36px;height:36px;border:1px solid var(--stroke);border-radius:8px;
  background:var(--panel2);color:var(--text);cursor:pointer;font-size:16px;line-height:1;
}
#burger:hover{border-color:var(--teal)}
.logos{display:flex;align-items:center;gap:16px;cursor:pointer;padding:6px 16px 6px 12px;
  background:#233648;border:1px solid var(--stroke);border-radius:10px;}
.logos:hover{border-color:var(--teal)}
.logos .lg{display:flex;align-items:center;gap:9px}
.logos svg{display:block;flex:none}
.logos .sep{width:1px;height:28px;background:rgba(255,255,255,.28)}
.logos span{font-size:7.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;line-height:1.35;max-width:150px;color:#fff}
.hdr-title{cursor:pointer}
.hdr-title:hover b{color:var(--teal)}
.hdr-title{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.hdr-title b{color:var(--text)}
/* ---------- каркас ---------- */
#app{display:flex;height:calc(100% - 56px)}
nav{
  width:296px;min-width:296px;background:var(--panel);border-right:1px solid var(--stroke);
  overflow-y:auto;padding:14px 10px 30px;transition:margin-left .25s ease;
}
nav.hidden{margin-left:-296px}
.nav-group{margin-bottom:14px}
.nav-group h3{
  font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
  padding:8px 10px 6px;font-weight:700;
}
.nav-btn{
  display:flex;gap:9px;align-items:baseline;width:100%;text-align:left;
  background:none;border:none;color:var(--text);font-family:inherit;font-size:12.5px;
  padding:8px 10px;border-radius:8px;cursor:pointer;line-height:1.35;
}
.nav-btn .num{color:var(--muted);font-size:10.5px;font-weight:700;min-width:16px}
.nav-btn:hover{background:var(--panel2)}
.nav-btn.active{background:var(--panel2);box-shadow:inset 3px 0 0 var(--red)}
.nav-btn.active .num{color:var(--red)}
main{flex:1;overflow-y:auto;padding:22px 26px 46px;position:relative}
/* ---------- слайд ---------- */
.slide{max-width:1420px;margin:0 auto;animation:fadeIn .35s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.slide-head{display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap;margin-bottom:18px}
.slide-title{flex:1;min-width:320px}
.slide-title h1{font-size:27px;font-weight:800;line-height:1.2;letter-spacing:.01em}
.slide-title h1 em{font-style:normal;color:var(--red)}
.slide-title .sub{color:var(--muted);font-size:12px;margin-top:5px}
.crumb{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;font-weight:600}
.crumb b{color:var(--text)}
.vyvod{
  min-width:300px;max-width:430px;border:1.5px solid var(--red);border-radius:12px;
  padding:12px 16px;background:rgba(232,76,76,.06);
}
.vyvod h4{color:var(--red);font-size:13px;margin-bottom:5px;font-weight:700}
.vyvod p{font-size:12.5px;line-height:1.5;color:var(--text)}
.vyvod .big{font-size:19px;font-weight:800;color:var(--red)}
.vyvod .big2{font-size:19px;font-weight:800;color:var(--teal)}
/* ---------- панели графиков ---------- */
.panel{
  background:var(--panel);border:1px solid var(--stroke);border-radius:14px;
  padding:16px 18px 12px;margin-bottom:18px;
}
.panel-tag{
  display:inline-block;background:var(--panel2);border:1px solid var(--stroke);
  color:var(--text);font-size:11px;font-weight:700;letter-spacing:.08em;
  padding:5px 12px;border-radius:7px;margin-bottom:10px;text-transform:uppercase;
}
.panel-tag i{font-style:normal;color:var(--muted);font-weight:500;text-transform:none;letter-spacing:0}
.panel h5{font-size:15px;font-weight:700;margin-bottom:8px}
.panel h5 em{font-style:normal;color:var(--red)}
.chart-wrap{position:relative;width:100%}
.chart-wrap.h-lg{height:470px}
.chart-wrap.h-md{height:390px}
.chart-wrap.h-sm{height:300px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:1100px){.grid2{grid-template-columns:1fr}}
.footnote{color:var(--muted);font-size:11px;margin-top:8px}
/* чипы и бейджи */
.chips{display:flex;flex-wrap:wrap;gap:22px;margin-top:6px}
.chip-group{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chip-group .lbl{font-size:12.5px;font-weight:700}
.chip-group .lbl i{font-style:normal;color:var(--muted);font-weight:500;font-size:11px;display:block}
.chip{
  background:var(--panel2);border:1px solid var(--stroke);border-radius:20px;
  padding:5px 12px;font-size:12px;display:flex;align-items:center;gap:7px;
}
.chip .n{width:17px;height:17px;border-radius:50%;background:var(--red);color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center}
.pct-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.pct-row .cap{color:var(--muted);font-size:11.5px;margin-right:4px}
.pct{
  width:52px;height:52px;border-radius:50%;border:2px solid var(--teal);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;
}
.pct.alert{border-color:var(--red);color:var(--red)}
.kpi-row{display:flex;gap:14px;flex-wrap:wrap;margin-top:4px}
.kpi{
  flex:1;min-width:230px;background:var(--panel);border:1px solid var(--stroke);
  border-radius:12px;padding:13px 18px;
}
.kpi .k-lbl{color:var(--muted);font-size:12px}
.kpi .k-val{font-size:26px;font-weight:800;margin-top:2px}
.kpi .k-val.red{color:var(--red)}
/* таблица портфеля (слайд 4) */
table.port{width:100%;border-collapse:collapse;font-size:12.5px}
table.port th{
  text-align:left;color:var(--muted);font-size:10.5px;letter-spacing:.09em;
  text-transform:uppercase;padding:8px 10px;border-bottom:1px solid var(--stroke);font-weight:700;
}
table.port td{padding:9px 10px;border-bottom:1px solid rgba(43,61,80,.6);vertical-align:middle}
table.port tr:hover td{background:rgba(111,179,210,.05)}
.dev-name{font-weight:700;font-size:13px;white-space:nowrap}
.bar-cell{display:flex;align-items:center;gap:10px;min-width:230px}
.bar-track{flex:1;height:18px;background:var(--panel2);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;background:var(--red);width:0;border-radius:4px;transition:width 1.4s cubic-bezier(.22,.8,.3,1)}
.bar-val{font-weight:800;min-width:54px;text-align:right}
.delta{font-size:11.5px;font-weight:700}
.delta.up{color:var(--green)}
.delta.dn{color:var(--red)}
.delta.zero{color:var(--muted)}
.num-cell{font-weight:700;white-space:nowrap}
.num-cell small{display:block;color:var(--muted);font-weight:500;font-size:10px}
/* переключатель метрик (слайд 16) */
.metric-tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.metric-tabs button{
  background:var(--panel2);border:1px solid var(--stroke);color:var(--text);
  font-family:inherit;font-size:12px;padding:7px 14px;border-radius:20px;cursor:pointer;
}
.metric-tabs button.active{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}
/* навигация низ */
.pager{display:flex;justify-content:space-between;margin-top:6px;max-width:1420px;margin-left:auto;margin-right:auto}
.pager button{
  background:var(--panel);border:1px solid var(--stroke);color:var(--text);
  font-family:inherit;font-size:12.5px;padding:9px 18px;border-radius:10px;cursor:pointer;
}
.pager button:hover{border-color:var(--teal)}
/* титул */
.cover{
  min-height:70vh;border-radius:18px;position:relative;overflow:hidden;
  background:linear-gradient(120deg,#16222f 0%,#1c2c3d 55%,#233b52 100%);
  border:1px solid var(--stroke);
  display:flex;flex-direction:column;justify-content:center;padding:60px 70px;
}
.cover::after{
  content:"";position:absolute;inset:0;
  background:
    linear-gradient(0deg, rgba(12,20,29,.25), rgba(12,20,29,.25)),
    repeating-linear-gradient(90deg, transparent 0 120px, rgba(148,169,188,.05) 120px 121px);
  pointer-events:none;
}
.cover .skyline{
  position:absolute;left:0;right:0;bottom:0;height:34%;opacity:.5;pointer-events:none;
  background:
   linear-gradient(0deg, rgba(59,86,111,.55), transparent 90%);
}
.cover .skyline i{position:absolute;bottom:0;background:#2c4157;display:block}
.cover h1{font-size:64px;line-height:1.04;font-weight:800;letter-spacing:.01em;position:relative;z-index:2}
.cover h1 em{font-style:normal;color:var(--red)}
.cover .date{
  margin-top:34px;font-size:15px;letter-spacing:.32em;font-weight:600;
  color:var(--text);position:relative;z-index:2;text-transform:uppercase;
}
.cover .date::after{content:"";display:block;width:280px;height:2px;background:var(--red);margin-top:12px}
.cover .logos-tab{
  position:absolute;top:0;left:0;z-index:3;background:#17222e;
  padding:16px 36px 16px 24px;border-radius:0 0 26px 0;
  border:1px solid var(--stroke);border-top:none;border-left:none;
}
.cover .logos-tab .logos{background:none;border:none;padding:0;cursor:default;gap:20px}
.cover .logos-tab .logos span{font-size:8.5px;max-width:160px}
.cover-start{
  margin-top:38px;align-self:flex-start;position:relative;z-index:2;
  background:var(--red);color:#fff;border:none;border-radius:10px;cursor:pointer;
  font-family:inherit;font-size:13.5px;font-weight:700;padding:12px 24px;
}
.cover-start:hover{filter:brightness(1.12)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--stroke);border-radius:6px}
::-webkit-scrollbar-track{background:transparent}
@media (prefers-reduced-motion: reduce){
  .bar-fill{transition:none}
  .slide{animation:none}
}
</style>
</head>
<body>
<header>
  <button id="burger" title="Свернуть меню">☰</button>
  <div class="logos" id="hdrLogos" title="На титульный лист"></div>
  <div class="hdr-title" id="hdrTitle" style="margin-left:auto" title="На титульный лист"><b>Рынок недвижимости Москвы</b> · июль 2026</div>
</header>
<div id="app">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>

<script>
/* ================= логотипы (SVG-стилизация под макет) ================= */
const LOGO_GERB = `<svg width="24" height="30" viewBox="0 0 40 48" fill="none">
  <path d="M20 2 L37 6 V26 C37 37 29 43.5 20 46 C11 43.5 3 37 3 26 V6 Z" stroke="#fff" stroke-width="2.2"/>
  <path d="M10 34 L30 12" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M11 29.5 C13.5 24.5 19 22.5 24 24.8 C26.6 26 27.6 28.8 25.8 30.8 L15 35.5 C12.5 34.5 11 32.3 11 29.5 Z" fill="#fff" opacity=".9"/>
  <circle cx="26.5" cy="20.5" r="2.4" fill="#fff"/>
</svg>`;
const LOGO_GK = `<svg width="30" height="30" viewBox="0 0 40 40" fill="none">
  <circle cx="20" cy="20" r="18" stroke="#fff" stroke-width="2"/>
  <circle cx="20" cy="20" r="14.2" stroke="#fff" stroke-width="1.1"/>
  <rect x="14.5" y="24" width="3.2" height="5.5" fill="#fff"/>
  <rect x="19" y="21" width="3.2" height="8.5" fill="#fff"/>
  <rect x="23.5" y="17.5" width="3.2" height="12" fill="#fff"/>
  <path d="M12.5 29.5 V11 H26.5 V14.5" stroke="#fff" stroke-width="1.7"/>
</svg>`;
const LOGO_DGP = `<svg width="30" height="30" viewBox="0 0 40 40" fill="none">
  <circle cx="20" cy="20" r="18" stroke="#fff" stroke-width="2"/>
  <path d="M11.5 27.5 V16.5 L22.5 12.5 V27.5" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M15 27.5 V21.5 C15 19.3 16.7 17.6 18.8 17.6 C20.9 17.6 22.5 19.3 22.5 21.5" stroke="#fff" stroke-width="1.8"/>
  <path d="M22.5 16.5 H28.5 V27.5" stroke="#fff" stroke-width="1.8"/>
  <path d="M9.5 27.5 H30.5" stroke="#fff" stroke-width="1.8"/>
</svg>`;
const LOGOS_HTML = `
  <div class="lg">${LOGO_GERB}</div><div class="sep"></div>
  <div class="lg">${LOGO_GK}<span>Градостроительный<br>комплекс Москвы</span></div>
  <div class="lg">${LOGO_DGP}<span>Департамент<br>градостроительной политики<br>города Москвы</span></div>`;

/* ================= базовая настройка Chart.js ================= */
Chart.register(ChartDataLabels);
Chart.defaults.font.family = "'Montserrat','Segoe UI',Roboto,Arial,sans-serif";
Chart.defaults.font.size = 11;
Chart.defaults.color = '#8ba0b5';
Chart.defaults.borderColor = 'rgba(43,61,80,.7)';
Chart.defaults.plugins.datalabels.display = false;
Chart.defaults.plugins.legend.labels.boxWidth = 14;
Chart.defaults.plugins.legend.labels.boxHeight = 14;
Chart.defaults.plugins.legend.labels.color = '#c6d4e0';
Chart.defaults.plugins.tooltip.backgroundColor = '#0e1720';
Chart.defaults.plugins.tooltip.borderColor = '#2b3d50';
Chart.defaults.plugins.tooltip.borderWidth = 1;
Chart.defaults.plugins.tooltip.titleColor = '#e8eef4';
Chart.defaults.plugins.tooltip.bodyColor = '#c6d4e0';
Chart.defaults.plugins.tooltip.padding = 10;

const C = {
  red:'#e84c4c', gray:'rgba(148,169,188,.5)', grayLine:'#94a9bc',
  navy:'#3b566f', navyD:'#2c4157', teal:'#6fb3d2', green:'#2fbf71',
  white:'#e8eef4', muted:'#8ba0b5', lgray:'#aebfce'
};
const fmt = v => v==null ? '' : v.toLocaleString('ru-RU');
let charts = [];
function destroyCharts(){ charts.forEach(c=>c.destroy()); charts = []; }
function mkChart(id, cfg){ const c = new Chart(document.getElementById(id), cfg); charts.push(c); return c; }

/* каскадная анимация: столбцы поднимаются, точки линий появляются слева направо */
function staggerAnim(step=42){
  return { duration:650, easing:'easeOutQuart',
    delay(ctx){ if(ctx.type!=='data'||ctx.mode!=='default') return 0;
      return ctx.dataIndex*step + ctx.datasetIndex*140; } };
}
/* «рисующаяся» линия для чисто линейных графиков */
function progressiveAnim(n, total=2400){
  const d = total/Math.max(n,1);
  return {
    x:{type:'number',easing:'linear',duration:d,from:NaN,
       delay(ctx){ if(ctx.type!=='data'||ctx.xStarted) return 0; ctx.xStarted=true; return ctx.index*d; }},
    y:{type:'number',easing:'linear',duration:d,from:'previousY',
       delay(ctx){ if(ctx.type!=='data'||ctx.yStarted) return 0; ctx.yStarted=true; return ctx.index*d; }}
  };
}
function axX(rot){ return { grid:{display:false}, ticks:{maxRotation:rot??0,minRotation:0,autoSkip:true,color:C.muted} }; }
function axY(unitCb){ return { grid:{color:'rgba(43,61,80,.5)'}, ticks:{callback:unitCb||(v=>fmt(v))} }; }

/* стандартный «комбо»-график буклета: серые годовые + красный период + линия темпа */
function comboChart(id, d){
  const grayRest = d.annual.map((a,i)=> a==null?null:Math.max(a-(d.period[i]||0),0));
  return mkChart(id, {
    data:{ labels:d.labels, datasets:[
      { type:'bar', label:d.periodName, data:d.period, backgroundColor:C.red, stack:'s',
        borderRadius:3, order:2,
        datalabels: d.showPeriodLabels ? {display:c=>c.dataset.data[c.dataIndex]!=null, color:'#fff',
          font:{weight:'700',size:10}, formatter:fmt, anchor:'center'} : {display:false} },
      { type:'bar', label:'В целом за год', data:grayRest, backgroundColor:C.gray, stack:'s',
        borderRadius:3, order:3,
        datalabels:{display:true, color:C.white, font:{weight:'800',size:10.5},
          anchor:'end', align:'top', offset:1, formatter:(v,c)=>fmt(d.annual[c.dataIndex])} },
      { type:'line', label:'Темп прироста, % (год к году)', data:d.growth, yAxisID:'y2',
        borderColor:C.teal, borderDash:[6,4], borderWidth:2, pointRadius:3.2,
        pointBackgroundColor:C.teal, tension:.35, spanGaps:true, order:1,
        datalabels:{display:c=>c.dataset.data[c.dataIndex]!=null, color:C.teal, align:'top',
          offset:4, font:{weight:'700',size:9.5}, formatter:v=>v+'%'} }
    ]},
    options:{
      responsive:true, maintainAspectRatio:false, animation:staggerAnim(),
      interaction:{mode:'index',intersect:false},
      layout:{padding:{top:26}},
      scales:{ x:axX(d.rotate??35), y:{...axY(), stacked:true, title:{display:true,text:d.unit,color:C.muted}},
        y2:{position:'right', grid:{display:false}, ticks:{callback:v=>v+'%'}} },
      plugins:{ legend:{position:'bottom'},
        tooltip:{callbacks:{ label(c){
          if(c.dataset.type==='line') return ' Темп прироста: '+c.parsed.y+'%';
          if(c.datasetIndex===1) return ' В целом за год: '+fmt(d.annual[c.dataIndex]);
          return ' '+d.periodName+': '+fmt(c.parsed.y);
        }}} }
    }
  });
}

/* парный график: столбцы + пунктирная линия темпа */
function twinChart(id,labels,data,growth,color){
  return mkChart(id,{data:{labels,datasets:[
    {type:'bar',label:'Объем',data,backgroundColor:color,borderRadius:4,
      datalabels:{display:true,color:C.white,anchor:'end',align:'top',font:{size:11,weight:'800'},formatter:fmt}},
    {type:'line',label:'Динамика, %',data:growth,yAxisID:'y2',borderColor:C.teal,borderDash:[6,4],
      borderWidth:2,pointRadius:3.2,pointBackgroundColor:C.teal,tension:.35,spanGaps:true,
      datalabels:{display:c=>c.dataset.data[c.dataIndex]!=null,color:C.teal,align:'top',offset:4,font:{size:10,weight:'700'},formatter:v=>v+'%'}}
  ]},options:{responsive:true,maintainAspectRatio:false,animation:staggerAnim(80),
    layout:{padding:{top:24}},interaction:{mode:'index',intersect:false},
    scales:{x:axX(20),y:axY(),y2:{position:'right',grid:{display:false},ticks:{callback:v=>v+'%'}}},
    plugins:{legend:{position:'bottom'}}}});
}

/* ================= данные ================= */
const Y16 = ['2011','2012','2013','2014','2015','2016','2017','2018','2019','2020','2021','2022','2023','2024','2025','янв-июнь 2026'];
const nulls = n => Array(n).fill(null);
const M25 = ['янв.25','фев.25','мар.25','апр.25','май.25','июн.25','июл.25','авг.25','сен.25','окт.25','ноя.25','дек.25'];
const Q = (y)=>['I кв.'+y,'II кв.'+y,'III кв.'+y,'IV кв.'+y];
const L29 = [...Q(22),...Q(23),...Q(24),...M25,'янв.26','фев.26','мар.26','апр.26','май.26'];

const SLIDES = [
{ id:'cover', nav:'Титульный лист', group:'', render(m){
  m.innerHTML = `<div class="slide"><div class="cover">
    <div class="logos-tab"><div class="logos">${LOGOS_HTML}</div></div>
    <h1>РЫНОК<br>НЕДВИЖИМОСТИ<br><em>МОСКВЫ</em></h1>
    <div class="date">Москва&nbsp;|&nbsp;Июль&nbsp;|&nbsp;2026</div>
    <button class="cover-start" onclick="go(1)">Открыть презентацию →</button>
    <div class="skyline" id="sky"></div>
  </div></div>`;
  const sky = document.getElementById('sky');
  for(let i=0;i<46;i++){ const b=document.createElement('i');
    const w=14+Math.random()*30, h=20+Math.random()*160;
    b.style.cssText=`left:${i*2.3}%;width:${w}px;height:${h}px;opacity:${.35+Math.random()*.5}`;

/* ================= каркас слайда ================= */
function body(m, s, inner){
  m.innerHTML = `<div class="slide">
    <div class="crumb">Рынок недвижимости Москвы 2026 &nbsp;|&nbsp; <b>${s.chapter||''}</b></div>
    <div class="slide-head">
      <div class="slide-title"><h1>${s.title}</h1>${s.sub?`<div class="sub">${s.sub}</div>`:''}</div>
      ${s.vyvod?`<div class="vyvod"><h4>Вывод:</h4><p>${s.vyvod}</p></div>`:''}
      ${s.vyvodHTML?`<div class="vyvod">${s.vyvodHTML}</div>`:''}
    </div>${inner}
    <div class="pager">
      <button onclick="go(-1)">← Предыдущий</button>
      <button onclick="go(1)">Следующий →</button>
    </div>`;
}

/* ================= навигация ================= */
const nav = document.getElementById('nav');
const main = document.getElementById('main');
let current = 0;
(function buildNav(){
  let g = null, wrap = null, counter = 0;
  SLIDES.forEach((s,i)=>{
    if(s.id === 'cover') return; /* титул открывается кликом по логотипам/названию в шапке */
    if(s.group !== g){
      g = s.group; wrap = document.createElement('div'); wrap.className='nav-group';
      if(g) wrap.innerHTML = `<h3>${g}</h3>`;
      nav.appendChild(wrap);
    }
    const b = document.createElement('button');
    b.className='nav-btn'; b.dataset.i=i;
    b.innerHTML = `<span class="num">${++counter}</span><span>${s.nav}</span>`;
    b.onclick = ()=>show(i);
    wrap.appendChild(b);
  });
})();
document.getElementById('hdrLogos').innerHTML = LOGOS_HTML;
document.getElementById('hdrLogos').onclick = ()=>show(0);
document.getElementById('hdrTitle').onclick = ()=>show(0);
function show(i){
  current = i;
  destroyCharts();
  nav.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active', +b.dataset.i===i));
  main.scrollTop = 0;
  SLIDES[i].render(main);
}
function go(d){ show((current + d + SLIDES.length) % SLIDES.length); }
document.getElementById('burger').onclick = ()=>nav.classList.toggle('hidden');
document.addEventListener('keydown', e=>{
  if(e.key==='ArrowRight') go(1);
  if(e.key==='ArrowLeft') go(-1);
});
show(0);
</script>
