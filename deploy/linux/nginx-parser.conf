# Safe default: accessible through an SSH tunnel to localhost:8080.
# Add your organisation's TLS, authentication and network policy before
# changing listen/server_name for remote clients.
server {
    listen 127.0.0.1:8080;
    server_name localhost;
    root /opt/parser-dashboard/frontend/dist;
    index index.html;

    # TDM actions have only a localhost guard in Python. A local reverse
    # proxy would appear trusted to the API, so never forward this path.
    location ^~ /api/v1/tdm {
        return 403;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
