# Эквивалент deploy/linux/nginx-parser.conf, но proxy_pass идёт на имя
# сервиса в docker-сети вместо 127.0.0.1.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # TDM-действия защищены только localhost-проверкой в Python. Прокси
    # выглядел бы для API доверенным источником, поэтому этот путь наружу
    # не пускаем вообще.
    location ^~ /api/v1/tdm {
        return 403;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
