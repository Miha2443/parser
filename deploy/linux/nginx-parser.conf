# Safe default: accessible through an SSH tunnel to localhost:8080.
# Add your organisation's TLS, authentication and network policy before
# changing listen/server_name for remote clients.
server {
    listen 127.0.0.1:8080;
    server_name localhost;
    root /opt/parser-dashboard/frontend/dist;
    index index.html;

    location = /api/v1/health { return 404; }
    location = /profile-snapshot.json { return 404; }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Dashboard-Probe "";
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
