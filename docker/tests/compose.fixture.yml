services:
  backend:
    environment:
      # Disposable publication fixtures exercise data, not browser sessions.
      PARSER_AUTH_ENABLED: "0"
  updater:
    environment:
      PARSER_COMPOSE_SMOKE: "1"
      FIXTURE_FAIL: ${FIXTURE_FAIL:-0}
    command: ["python", "-m", "docker.tests.fixture", "update"]
